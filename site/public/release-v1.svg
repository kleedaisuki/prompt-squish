<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="release-title release-description">
  <title id="release-title">xmlsquish 1.0 — Prompt projects, managed.</title>
  <desc id="release-description">Release card for xmlsquish 1.0, a project manager for prompt projects, featuring new, fmt, build, add, remove, and inspect.</desc>
  <defs>
    <!-- 可复用的品牌渐变与阴影。Reusable brand gradients and shadows. -->
    <linearGradient id="night" x1="60" y1="0" x2="1140" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17131f"/>
      <stop offset=".58" stop-color="#241828"/>
      <stop offset="1" stop-color="#3a1d2c"/>
    </linearGradient>
    <linearGradient id="coral" x1="101" y1="80" x2="283" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff9a78"/>
      <stop offset="1" stop-color="#bd4525"/>
    </linearGradient>
    <linearGradient id="version" x1="842" y1="62" x2="1108" y2="294" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffca78"/>
      <stop offset="1" stop-color="#ff8066"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#09060c" flood-opacity=".48"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- 深色终端画布；高对比设计在明暗界面预览中均保持清晰。
       Dark terminal canvas; high contrast remains legible in light and dark previews. -->
  <rect width="1200" height="630" rx="36" fill="url(#night)"/>
  <rect width="1200" height="630" rx="36" fill="url(#grid)"/>
  <path d="M0 510C221 440 346 602 600 525s397-48 600 39v66H0Z" fill="#ff8a6a" fill-opacity=".055"/>
  <circle cx="1114" cy="80" r="184" fill="#ff9a78" fill-opacity=".06"/>

  <!-- 品牌图标：延续 favicon 的 XML 括号与星芒。Brand mark: XML brackets and sparkle from the favicon. -->
  <g filter="url(#soft-shadow)">
    <rect x="72" y="65" width="126" height="126" rx="37" fill="url(#coral)"/>
    <path d="m116 106-23 22 23 23m38-45 23 22-23 23m-7-54-25 64" fill="none" stroke="#fff8ed" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M179 62c2 13 7 18 20 20-13 2-18 7-20 20-2-13-7-18-20-20 13-2 18-7 20-20Z" fill="#ffca78" stroke="#fff1b8" stroke-width="3"/>
  </g>

  <text x="226" y="114" fill="#fff9f2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="43" font-weight="760" letter-spacing="-1.8">xmlsquish</text>
  <text x="229" y="154" fill="#b9afbe" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', monospace" font-size="19" letter-spacing="2.5">PROJECT MANAGER FOR PROMPTS</text>

  <!-- 版本胶囊是发布页的主要识别锚点。The version capsule is the release's primary identity anchor. -->
  <g transform="rotate(2 987 135)" filter="url(#soft-shadow)">
    <rect x="857" y="74" width="260" height="122" rx="28" fill="url(#version)"/>
    <text x="987" y="120" text-anchor="middle" fill="#3b1720" font-family="ui-monospace, 'Cascadia Mono', monospace" font-size="19" font-weight="700" letter-spacing="3">RELEASE READY</text>
    <text x="987" y="174" text-anchor="middle" fill="#21121b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="850" letter-spacing="-2">1.0</text>
  </g>

  <g fill="#ffca78" aria-hidden="true">
    <path d="M795 92c1 10 5 14 15 15-10 1-14 5-15 15-1-10-5-14-15-15 10-1 14-5 15-15Z"/>
    <circle cx="815" cy="157" r="4"/>
    <circle cx="1127" cy="229" r="5"/>
  </g>

  <!-- 核心产品主张。Core product promise. -->
  <text x="72" y="307" fill="#fff9f2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="69" font-weight="790" letter-spacing="-3.4">Prompt projects,</text>
  <text x="72" y="382" fill="#ff9a78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="69" font-weight="790" letter-spacing="-3.4">managed.</text>
  <path d="M73 400h410" stroke="#ffca78" stroke-width="4" stroke-linecap="round"/>

  <!-- 命令带准确列出 1.0 的完整项目生命周期。Command strip lists the complete 1.0 project lifecycle. -->
  <g transform="translate(72 459)" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', monospace" font-size="21" font-weight="700">
    <rect width="1056" height="104" rx="22" fill="#100d16" stroke="#fff" stroke-opacity=".14"/>
    <circle cx="29" cy="28" r="5" fill="#ff8066"/>
    <circle cx="47" cy="28" r="5" fill="#ffca78"/>
    <circle cx="65" cy="28" r="5" fill="#78d6b1"/>
    <text x="85" y="35" fill="#8f8494" font-size="14" font-weight="500" letter-spacing="1.5">xmlsquish / lifecycle</text>
    <g transform="translate(28 71)">
      <text x="0" y="0" fill="#ffca78">new</text>
      <text x="72" y="0" fill="#716777">·</text>
      <text x="101" y="0" fill="#fff9f2">fmt</text>
      <text x="159" y="0" fill="#716777">·</text>
      <text x="189" y="0" fill="#fff9f2">build</text>
      <text x="273" y="0" fill="#716777">·</text>
      <text x="303" y="0" fill="#fff9f2">add</text>
      <text x="362" y="0" fill="#716777">·</text>
      <text x="392" y="0" fill="#fff9f2">remove</text>
      <text x="500" y="0" fill="#716777">·</text>
      <text x="530" y="0" fill="#fff9f2">inspect</text>
      <text x="846" y="0" fill="#ff9a78" font-size="17" font-weight="600">xmlsquish 1.0</text>
    </g>
  </g>

  <text x="1128" y="605" text-anchor="end" fill="#8f8494" font-family="ui-monospace, 'Cascadia Mono', monospace" font-size="13" letter-spacing="1">SOURCE · COMPOSE · BUILD</text>
</svg>
