[package]
name = "squish-manager"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified project-manager orchestration for prompt-squish"

[dependencies]
blake3 = "1.8"
quick-xml = "0.38"
semver = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
squish-backend = { path = "../squish-backend" }
squish-build = { path = "../squish-build" }
squish-format = { path = "../squish-format" }
squish-ir = { path = "../squish-ir" }
squish-kernel = { path = "../squish-kernel" }
squish-link = { path = "../squish-link" }
squish-project = { path = "../squish-project" }
squish-protocol = { path = "../squish-protocol" }
squish-repository = { path = "../squish-repository" }
squish-resolver = { path = "../squish-resolver" }
squish-source = { path = "../squish-source" }
squish-xml-front = { path = "../squish-xml-front" }
walkdir = "2.5"

[dev-dependencies]
squish-publish = { path = "../squish-publish" }
squish-store = { path = "../squish-store" }
tempfile = "3.23"
