[package]
name = "squish-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend contracts for prompt-squish"
autobenches = false

[features]
# Explicit hosted mechanism probes; ordinary crate builds do not run these suites.
mechanism-benchmarks = []

[[bench]]
name = "archive_latency"
harness = false
required-features = ["mechanism-benchmarks"]

[[bench]]
name = "archive_allocations"
harness = false
required-features = ["mechanism-benchmarks"]

[dependencies]
squish-ir = { path = "../squish-ir" }
squish-protocol = { path = "../squish-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.5"
blake3 = "1.8"
