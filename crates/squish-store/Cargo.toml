[package]
name = "squish-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Artifact and cache storage domain for prompt-squish"

[dependencies]
blake3 = "1.8"
rusqlite = { version = "0.40", features = ["bundled"] }
squish-build = { path = "../squish-build" }
squish-platform-fs = { path = "../squish-platform-fs" }
squish-protocol = { path = "../squish-protocol" }

[dev-dependencies]
tempfile = "3.27"
