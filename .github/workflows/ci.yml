name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust quality (Ubuntu, MSRV 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Rust version with quality tools
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy

      - name: Verify minimum supported Rust toolchain
        run: |
          rustc +1.88.0 --version
          cargo +1.88.0 --version
          cargo +1.88.0 fmt --version
          cargo +1.88.0 clippy --version

      - name: Check minimum supported Rust version
        run: cargo +1.88.0 check --all-targets --locked

      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.88.0 clippy --all-targets --all-features --locked -- -D warnings

  rust-test:
    name: Rust test (${{ matrix.name }}, MSRV 1.88)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Rust version
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Verify minimum supported Rust toolchain
        run: |
          rustc +1.88.0 --version
          cargo +1.88.0 --version

      - name: Build all targets
        run: cargo +1.88.0 build --all-targets --all-features --locked

      - name: Run tests
        run: cargo +1.88.0 test --all-features --locked

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build site
        run: npm run build
