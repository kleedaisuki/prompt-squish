name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to publish, for example v1.0.0'
        required: true
        type: string

# Build jobs cannot publish; only the final aggregation job can write releases.
# 构建任务无发布权限；仅全部成功后的汇总任务可以写入发布资产。
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable source commit
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # Server 2022's pre-24H2 ConPTY can block ClosePseudoConsole indefinitely even
          # while a PTY reader drains output. Server 2025 keeps the full native PTY suite
          # while using the corrected build-26100 close semantics.
          # Server 2022 的旧版 ConPTY 可能无限阻塞 ClosePseudoConsole；Server 2025
          # 在保留完整原生 PTY 测试的同时使用 build 26100 修正后的关闭语义。
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      # Bundle the Windows C runtime for extract-and-run installs.
      # 静态链接 Windows C 运行时，支持解压即用。
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      # Keep release automation separate from old tags that do not contain it.
      # 发布脚本来自工作流提交，而非可能尚未包含脚本的历史标签。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Build locked release binary
        working-directory: source
        run: cargo +1.88.0 build --release --locked --target ${{ matrix.target }}
      - name: Run native release tests
        if: runner.os != 'macOS'
        working-directory: source
        run: cargo +1.88.0 test --release --all-features --locked --target ${{ matrix.target }}
      - name: Run native macOS tests with case-sensitive temporary files
        if: runner.os == 'macOS'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          # Historical tags assume Unix temporary files distinguish a.xml/a.XML.
          # 历史标签假设 Unix 临时文件区分 a.xml/a.XML；仅调整测试临时目录。
          image="$RUNNER_TEMP/xmlsquish-tests.sparseimage"
          mount="$RUNNER_TEMP/xmlsquish-tests-volume"
          hdiutil create -size 256m -type SPARSE -fs 'Case-sensitive APFS' -volname xmlsquish-tests "$image"
          mkdir -p "$mount"
          hdiutil attach "$image" -mountpoint "$mount" -nobrowse
          trap 'hdiutil detach "$mount" || hdiutil detach "$mount" -force' EXIT
          mkdir "$mount/tmp"
          touch "$mount/tmp/case-probe"
          test ! -e "$mount/tmp/CASE-PROBE"
          TMPDIR="$mount/tmp" cargo +1.88.0 test --release --all-features --locked --target ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Smoke test and package
        run: python automation/.github/scripts/release.py package source dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Verify complete matrix and publish without replacing assets
        run: python automation/.github/scripts/release.py publish source dist
