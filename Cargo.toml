[workspace]
members = [
    "crates/xmlsquish-core",
    "crates/xmlsquish-app",
    "crates/xmlsquish-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/kleedaisuki/prompt-squish"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
glob = "0.3.4"
tempfile = "3.23.0"
tiktoken-rs = "0.12.0"
walkdir = "2.5.0"
