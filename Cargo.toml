[package]
name = "xmlsquish"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/kleedaisuki/prompt-squish"
description = "Compile XML prompt macros and compress whitespace"

# Ship only Rust sources, language fixtures, and essential documentation.
# 仅发布 Rust 源码、语言测试样例和必要文档，不包含站点资产。
include = ["/src/**", "/examples/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[[test]]
name = "diagnostics"
path = "src/cli/diagnostics.integration.test.rs"

[[test]]
name = "semantic_pipeline"
path = "src/cli/pipeline.integration.test.rs"

[[test]]
name = "package"
path = "src/package.test.rs"

[dependencies]
anstream = "1.0"
clap = { version = "4.6.6", features = ["derive"] }
glob = "0.3.4"
quick-xml = "0.38"
regex = "1.12"
tempfile = "3.23.0"
tiktoken-rs = "0.12.0"
walkdir = "2.5.0"
