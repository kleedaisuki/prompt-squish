[package]
name = "xmlsquish"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/kleedaisuki/prompt-squish"
description = "Build prompts and manage xmlsquish projects"
publish = false

# The root package is source-installed from the workspace and is not published to crates.io.
# 根包从完整 workspace 源码安装，不发布到 crates.io。
include = ["/src/**", "/examples/**", "/docs/dsl.md", "/docs/releases/**", "/CHANGELOG.md", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[workspace]
members = [
    "crates/squish-backend",
    "crates/squish-build",
    "crates/squish-cli",
    "crates/squish-config",
    "crates/squish-fetch",
    "crates/squish-format",
    "crates/squish-host",
    "crates/squish-ir",
    "crates/squish-kernel",
    "crates/squish-link",
    "crates/squish-manager",
    "crates/squish-presentation",
    "crates/squish-project",
    "crates/squish-protocol",
    "crates/squish-publish",
    "crates/squish-repository",
    "crates/squish-resolver",
    "crates/squish-source",
    "crates/squish-store",
    "crates/squish-xml-front",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/kleedaisuki/prompt-squish"

[dependencies]
blake3 = "1.8"
ctrlc = "3.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
squish-cli = { path = "crates/squish-cli" }
squish-config = { path = "crates/squish-config" }
squish-fetch = { path = "crates/squish-fetch" }
squish-host = { path = "crates/squish-host" }
squish-kernel = { path = "crates/squish-kernel" }
squish-manager = { path = "crates/squish-manager" }
squish-presentation = { path = "crates/squish-presentation" }
squish-protocol = { path = "crates/squish-protocol" }
squish-repository = { path = "crates/squish-repository" }
squish-store = { path = "crates/squish-store" }

[dev-dependencies]
tempfile = "3.23"
